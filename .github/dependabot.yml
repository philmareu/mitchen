# One grouped pull request a month for each ecosystem.
# Security fixes don't wait for this schedule: with Dependabot security updates
# turned on in the repository settings, they get their own pull requests.
version: 2

updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: monthly
    # Update composer.lock inside the constraints in composer.json, like
    # `composer update`. Major upgrades (Laravel, Filament) are done by hand.
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 1
    # Skip releases less than a week old.
    cooldown:
      default-days: 7
    groups:
      composer:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']

# npm is left out on purpose. package.json only holds build tools, and Mitchen's
# pages don't load anything they build.
